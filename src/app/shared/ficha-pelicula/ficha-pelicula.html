<article class="ficha">
  <div class="cartel">
    <!-- El título está escrito abajo, en el enlace: el póster es decoración -->
    <app-poster [titulo]="pelicula().titulo" [url]="pelicula().poster_url" [decorativo]="true" />

    <!-- RF-07: la destacó el administrador. Es texto, no una estrella de color -->
    @if (pelicula().destacada) {
      <p class="destacada">Destacada</p>
    }
  </div>

  <h3 class="titulo">
    <a [routerLink]="['/peliculas', pelicula().id]" [title]="pelicula().titulo">{{
      pelicula().titulo
    }}</a>
  </h3>

  <p class="datos">{{ datos() }}</p>

  <div class="calificacion">
    <app-sello-edad [edad]="pelicula().restriccion_edad" />
    <!-- Con puntaje se oculta el "(N)": en la grilla alcanza con el promedio -->
    <app-estrellas [valor]="puntaje()?.promedio ?? 0" [cantidad]="puntaje() ? null : 0" />
  </div>
</article>
