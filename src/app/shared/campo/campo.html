<label class="etiqueta" [for]="id">
  {{ etiqueta() }}
  @if (requerido()) {
    <span class="requerido">obligatorio</span>
  }
</label>

@if (filas() > 0) {
  <textarea
    class="control control--multilinea"
    [class.control--error]="hayError()"
    [id]="id"
    [rows]="filas()"
    [value]="valor()"
    [placeholder]="marcador()"
    [disabled]="deshabilitado()"
    [required]="requerido()"
    [attr.maxlength]="largoMaximo()"
    [attr.aria-invalid]="hayError() ? 'true' : null"
    [attr.aria-describedby]="descripcion()"
    (input)="alEscribir($event)"
  ></textarea>
} @else {
  <input
    class="control"
    [class.control--error]="hayError()"
    [id]="id"
    [type]="tipo()"
    [value]="valor()"
    [placeholder]="marcador()"
    [disabled]="deshabilitado()"
    [required]="requerido()"
    [attr.autocomplete]="autocompletado() || null"
    [attr.aria-invalid]="hayError() ? 'true' : null"
    [attr.aria-describedby]="descripcion()"
    (input)="alEscribir($event)"
  />
}

@if (largoMaximo() !== null) {
  <!-- Visual: anunciar cada tecla con un aria-live sería ruido. El tope lo frena el navegador -->
  <p class="contador">{{ valor().length }} / {{ largoMaximo() }}</p>
}

@if (hayError()) {
  <!--
    role="alert" además del aria-describedby: son dos casos distintos. El describedby cubre
    a quien llega al campo con Tab y quiere saber qué pasa; el alert cubre el error que
    aparece al enviar el formulario, cuando el foco ya está en otro lado y si no nadie se entera.
    Como el nodo lo crea el @if, nace con el role puesto y el lector lo lee al insertarse.
  -->
  <p class="error" role="alert" [id]="idError">
    <!-- El error no se comunica solo con el borde rojo: suma ícono y explicación -->
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path
        d="M10 2.5L19 18H1z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
      <path d="M10 7.5v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="10" cy="14.6" r="1" fill="currentColor" />
    </svg>
    {{ error() }}
  </p>
} @else if (ayuda()) {
  <p class="ayuda" [id]="idAyuda">{{ ayuda() }}</p>
}
