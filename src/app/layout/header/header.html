<header class="header">
  <div class="barra contenedor">
    <a class="marca" routerLink="/">
      <span class="marca__bombillas" aria-hidden="true"></span>
      <span class="marca__cine">Cine</span>
      <span class="marca__nombre">Emezeta</span>
      <span class="marca__pie">Desde 1961 · Sala única</span>
      <span class="marca__bombillas" aria-hidden="true"></span>
    </a>

    <nav class="nav" aria-label="Principal">
      <ul>
        <!-- exact: sin esto "Cartelera" quedaría activo en todas las rutas, porque todas empiezan con "/" -->
        <li>
          <a
            routerLink="/"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >Cartelera</a
          >
        </li>
        <!--
          Sin exact: la ficha de una película (/peliculas/:id) también es "Películas".
          El enlace vuelve a /peliculas a secas, que es lo que reinicia los filtros del buscador.
        -->
        <li>
          <a routerLink="/peliculas" routerLinkActive="activo" ariaCurrentWhenActive="page"
            >Películas</a
          >
        </li>
        <!-- Próximamente, Candy y Mi entrada se suman cuando exista su ruta -->
      </ul>
    </nav>

    <!-- La compra es anónima (D-04): el header nunca asume que hay sesión iniciada -->
    <p class="aviso">
      <strong>Comprás sin cuenta.</strong> Te mandamos el QR por mail y entrás con eso.
    </p>

    @if (haySesion()) {
      <div class="cuenta">
        <!-- El nombre es el enlace al perfil: un saludo que además lleva a algún lado -->
        <a class="cuenta__nombre" routerLink="/perfil">
          <span class="cuenta__hola">Hola,</span>
          {{ perfil()?.nombre || 'tu cuenta' }}
        </a>

        @if (esAdmin()) {
          <!--
            El acceso al panel aparece según el rol, pero el rol de verdad lo decide la
            base: aunque alguien fuerce este signo, las funciones de la base no le van a
            responder (RNF-09).
          -->
          <a class="cuenta__rol" routerLink="/admin">Administración</a>
        } @else if (esPersonal()) {
          <!-- El panel del empleado (escaneo de QR) llega en la F8: hasta entonces es un rótulo -->
          <span class="cuenta__rol">Empleado</span>
        }

        <button class="boton boton--borde" type="button" (click)="salir()">Salir</button>
      </div>
    } @else {
      <a class="boton boton--borde ingresar" routerLink="/ingresar">Ingresar</a>
    }
  </div>

  <div class="guirnalda" aria-hidden="true"></div>
</header>
